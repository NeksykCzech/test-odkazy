:root{
  --bg:#0B0B0B; --surface:#1A1A1A; --border:#2A2A2A; --text:#D4D4D4; --muted:#7C7C7C;
  --accent:#1148E6; --accent-text:#3873FF; --accent-dim:#000B54; --logo:#FFFFFF;
  --font:"GeekBoy",Arial,Helvetica,system-ui,sans-serif; color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root{--bg:#F3F3F3; --surface:#FFFFFF; --border:#B6B6B6; --text:#0B0B0B; --muted:#606060; --accent-text:#1148E6; --accent-dim:#EEF4FF; --logo:#0B0B0B; color-scheme:light}
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:17px;line-height:1.45;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
main{max-width:480px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px;flex:1}
.logo{color:var(--logo);padding:18px 0 4px} .logo svg{height:18px;width:auto;display:block}
.video{border-radius:12px;overflow:hidden;background:var(--surface);border:1px solid var(--border)}
.video img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.video b{display:block;padding:10px 12px;font-size:16px;line-height:1.25}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:16px 14px;font-weight:700;font-size:18px;font-family:inherit;
  text-decoration:none;color:#fff;background:var(--accent);border:0;cursor:pointer;width:100%;-webkit-tap-highlight-color:transparent}
.btn:active{scale:.96}
.btn.sec{background:transparent;color:var(--text);border:1px solid var(--border);font-size:16px;padding:13px 14px}
p{margin:0;color:var(--muted);font-size:15px}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.steps li{display:flex;gap:12px;align-items:flex-start;font-size:16px}
.steps li i{font-style:normal;flex:0 0 26px;height:26px;border-radius:7px;background:var(--accent);color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.arrow{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 6px);width:40px;height:40px;color:var(--accent-text);pointer-events:none}
@media (prefers-reduced-motion:no-preference){.arrow{animation:bob 1.1s cubic-bezier(.16,1,.3,1) infinite}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--border);font-size:13px;color:var(--muted)}
.foot code{font-family:inherit;color:var(--text)}
details{font-size:14px;color:var(--muted)} summary{cursor:pointer;font-weight:700;color:var(--text)}
details div{display:flex;flex-direction:column;gap:6px;margin-top:8px}
details a{color:var(--accent-text)}
[hidden]{display:none!important}
</style>

  var intentAny = 'intent://www.youtube.com/watch?v=' + id + '#Intent;scheme=https;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;S.browser_fallback_url=' + encodeURIComponent(WEB) + ';end';
  var schemeYT = 'youtube://www.youtube.com/watch?v=' + id;
  var vnd = 'vnd.youtube://youtube.com/watch?v=' + id;                 // tohle používá openinyoutube.com (Android i iPhone)
  var primary = (isAndroid || isIOS) ? vnd : WEB;
  var weak = app === 'tiktok';

  // ?auto=1: přesně to, co dělá openinyoutube.com: bez klepnutí, hned při načtení.
  // Android: nejdřív schéma, hned potom youtube.com jako záloha; iPhone: jen schéma.
  if (q.get('auto') === '1') {
    if (isAndroid) { location.replace(vnd); location.replace(WEB); return; }
    if (isIOS) { location.replace(vnd); setTimeout(function(){ document.getElementById('app').innerHTML = '<p style="padding:24px 0">Automatický pokus proběhl. Když ještě vidíš tuhle stránku, ' + esc(appName) + ' ho zahodil.</p><a class="btn" href="' + vnd + '">Otevřít v YouTube</a>'; }, 2500); return; }
  }

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  var video = '<div class="video"><img src="https://i.ytimg.com/vi/' + id + '/hqdefault.jpg" alt=""><b id="title">Video GeekBoy</b></div>';
  var steps = '<ol class="steps"><li><i>1</i><span>Klepni na <b>⋯</b> vpravo nahoře</span></li><li><i>2</i><span>Vyber <b>Otevřít v ' + (isIOS ? 'Safari' : 'prohlížeči') + '</b>, YouTube se pak otevře samo</span></li></ol>';
  var arrow = '<svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/><path d="M6 20l6-6 6 6" opacity=".45"/></svg>';
  var more = '<details><summary>Další cesty (jen pro test)</summary><div>' +
    (isAndroid ? '<a href="' + intentYT + '">intent s balíčkem YouTube</a><a href="' + intentAny + '">intent bez balíčku (výchozí appka pro youtube.com)</a><a href="' + schemeYT + '">youtube://</a>' : '') +
    (isIOS ? '<a href="' + schemeYT + '">youtube://</a>' : '') +
    '<a href="' + WEB + '">obyčejný odkaz youtube.com</a><a href="yt.html?v=' + id + '&amp;auto=1">automaticky při načtení, jako openinyoutube.com</a></div></details>';
  var foot = '<div class="foot">Test: <code>' + esc(appName) + ', ' + (isAndroid ? 'Android' : (isIOS ? 'iOS' : 'jiný systém')) + '</code></div>';
  document.getElementById('app').innerHTML = '<div class="logo">' + LOGO + '</div>' + video +
    '<a class="btn" href="' + primary + '">Otevřít v YouTube</a>' +
    '<p>' + (weak ? 'V TikToku tlačítko často nezabere. Pak:' : 'Když se nic nestane:') + '</p>' + steps +
    '<a class="btn sec" href="' + WEB + '">Přehrát tady</a>' + more + (weak ? arrow : '') + foot;

  // Název videa (bez klíče, přes oEmbed); když nepřijde, zůstane „Video GeekBoy“.
  try {
    fetch('https://www.youtube.com/oembed?url=' + encodeURIComponent(WEB) + '&format=json').then(function(r){ return r.json(); }).then(function(j){ if (j && j.title) document.getElementById('title').textContent = j.title; }).catch(function(){});
  } catch(e){}
})();
</script>
</body>
</html>
