<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Apple iPhone 16e na Alze</title>
<style>
/*__GBFONTS__*/
:root{
  --bg:#0B0B0B; --surface:#1A1A1A; --border:#2A2A2A; --text:#D4D4D4; --muted:#7C7C7C;
  --accent:#1148E6; --accent-text:#3873FF; --accent-dim:#000B54; --logo:#FFFFFF;
  --font:"GeekBoy",Arial,Helvetica,system-ui,sans-serif; color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root{--bg:#F3F3F3; --surface:#FFFFFF; --border:#B6B6B6; --text:#0B0B0B; --muted:#606060; --accent-text:#1148E6; --accent-dim:#EEF4FF; --logo:#0B0B0B; color-scheme:light}
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:17px;line-height:1.45;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
main{max-width:480px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px;flex:1}
.logo{color:var(--logo);padding:18px 0 4px} .logo svg{height:18px;width:auto;display:block}
.what{display:flex;gap:12px;align-items:center;border:1px solid var(--border);border-radius:12px;padding:12px;background:var(--surface)}
.what .ph{width:56px;height:56px;border-radius:9px;background:#fff;outline:1px solid rgba(0,0,0,.1);outline-offset:-1px;flex:0 0 auto;overflow:hidden}
.what .ph img{width:100%;height:100%;object-fit:contain;display:block;padding:4px}
.what b{display:block;font-size:17px;line-height:1.2}
h1{margin:8px 0 0;font-size:24px;line-height:1.15;font-weight:700;text-wrap:balance}
p{margin:0;color:var(--muted);font-size:15px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:15px 14px;font-weight:700;font-size:17px;font-family:inherit;
  text-decoration:none;color:#fff;background:var(--accent);border:0;cursor:pointer;width:100%;-webkit-tap-highlight-color:transparent}
.btn:active{scale:.96}
.btn.sec{background:transparent;color:var(--text);border:1px solid var(--border)}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.steps li{display:flex;gap:12px;align-items:flex-start;font-size:16px}
.steps li i{font-style:normal;flex:0 0 26px;height:26px;border-radius:7px;background:var(--accent);color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.arrow{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 6px);width:40px;height:40px;color:var(--accent-text);pointer-events:none}
@media (prefers-reduced-motion:no-preference){.arrow{animation:bob 1.1s cubic-bezier(.16,1,.3,1) infinite}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.band{display:flex;align-items:center;gap:10px;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding:10px 16px;background:var(--accent-dim);border-bottom:1px solid var(--border);font-size:14px}
.band b{font-weight:700}
.band a{margin-left:auto;background:var(--accent);color:#fff;border-radius:8px;padding:8px 12px;font-weight:700;white-space:nowrap;text-decoration:none}
.foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--border);font-size:13px;color:var(--muted)}
.foot code{font-family:inherit;color:var(--text)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;transition:opacity .15s ease-out;pointer-events:none}
.toast.on{opacity:1}
[hidden]{display:none!important}
</style>
</head>
<body>
<main id="app"></main>
<div class="toast" id="toast">Odkaz zkopírován</div>
<script src="https://cdn.jsdelivr.net/npm/inapp-spy@5.0.10/dist/index.global.js"></script>
<script>
(function(){
  var TARGET = 'https://www.geekboy.cz/8BJer/';            // iPhone 16e na Alze (dnešní krátký odkaz)
  var LOGO = '<!--__LOGO__-->';
  var PHOTO = '__PHOTO__';
  var q = new URLSearchParams(location.search);
  var variant = q.get('v') === 'c' ? 'c' : 'b';
  var stay = q.get('stay') === '1';
  var ua = navigator.userAgent || '';
  var isAndroid = /Android/i.test(ua), isIOS = /iPhone|iPad|iPod/i.test(ua);
  var app = /Instagram/i.test(ua) ? 'instagram' : (/Barcelona/i.test(ua) ? 'threads' : (/TikTok|BytedanceWebview|musical_ly/i.test(ua) ? 'tiktok' : (/FBAN|FBAV|FB_IAB/i.test(ua) ? 'facebook' : null)));
  var spy = null; try { spy = window.InAppSpy ? window.InAppSpy() : null; } catch(e){}
  var inApp = !!app || !!(spy && spy.isInApp);
  var appName = app ? {instagram:'Instagram', threads:'Threads', tiktok:'TikTok', facebook:'Facebook'}[app] : (spy && spy.appName) || 'aplikace';
  var browser = isIOS ? 'Safari' : 'Chromu';

  // Venku (Safari, Chrome) mezistránka nemá co dělat: rovnou do obchodu. ?stay=1 ji ukáže i tak.
  if (!inApp && !stay) { location.replace(TARGET); return; }

  // Úniková adresa podle prostředí. Vždy jen jako odkaz, na který se klepne; nic se nespouští samo.
  function intentUrl(u){ var m = u.match(/^https?:\/\/([^#]*)(#.*)?$/); return 'intent://' + m[1] + '#Intent;scheme=https;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;S.browser_fallback_url=' + encodeURIComponent(u) + ';end'; }
  var escapeUrl = null;
  if (isAndroid && app !== 'tiktok') escapeUrl = intentUrl(TARGET);
  else if (isIOS && app === 'instagram') escapeUrl = 'instagram://extbrowser/?url=' + encodeURIComponent(TARGET);
  else if (isIOS && app === 'threads') escapeUrl = 'barcelona://extbrowser/?url=' + encodeURIComponent(TARGET);
  var canEscape = !!escapeUrl;

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  var what = '<div class="what"><div class="ph"><img src="' + PHOTO + '" alt=""></div><div><b>Apple iPhone 16e 128 GB černý</b></div></div>';
  var steps = '<ol class="steps"><li><i>1</i><span>Klepni na <b>⋯</b> vpravo nahoře</span></li><li><i>2</i><span>Vyber <b>Otevřít v ' + (isIOS ? 'Safari' : 'prohlížeči') + '</b></span></li></ol>';
  var arrow = '<svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/><path d="M6 20l6-6 6 6" opacity=".45"/></svg>';
  var copyBtn = '<button class="btn sec" type="button" id="copy">Kopírovat odkaz</button>';
  var contBtn = '<a class="btn sec" href="' + TARGET + '">Pokračovat tady</a>';
  var foot = '<div class="foot">Proč: v prohlížeči se nákup připíše GeekBoy i později a Alza se otevře v aplikaci.<br>Test: <code>' + esc(appName) + ', ' + (isAndroid ? 'Android' : (isIOS ? 'iOS' : 'jiný systém')) + ', varianta ' + variant.toUpperCase() + '</code></div>';
  var html;
  if (variant === 'c') {
    var band = canEscape
      ? '<div class="band"><b>Otevřít v ' + browser + '</b> kvůli nákupu<a href="' + escapeUrl + '">Otevřít</a></div>'
      : '<div class="band"><b>Otevřít v prohlížeči:</b> ⋯ vpravo nahoře<a href="#" id="copy2">Kopírovat</a></div>';
    html = band + '<div class="logo">' + LOGO + '</div>' + what + '<a class="btn" href="' + TARGET + '">Pokračovat na Alzu</a>' + (canEscape ? '' : arrow) + foot;
  } else if (canEscape) {
    html = '<div class="logo">' + LOGO + '</div>' + what + '<h1>Otevřít Alzu v ' + browser + '</h1>' +
      '<a class="btn" href="' + escapeUrl + '">Otevřít v ' + browser + '</a>' +
      '<p>Když se nic nestane:</p>' + steps + copyBtn + contBtn + foot;
  } else {
    html = '<div class="logo">' + LOGO + '</div>' + what + '<h1>Otevři odkaz v prohlížeči</h1>' + steps +
      '<p>Nebo si odkaz zkopíruj a vlož do ' + browser + '.</p>' + copyBtn + contBtn + arrow + foot;
  }
  document.getElementById('app').innerHTML = html;

  function copy(ev){ if (ev) ev.preventDefault();
    var done = function(){ var t = document.getElementById('toast'); t.classList.add('on'); setTimeout(function(){ t.classList.remove('on'); }, 1600); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(TARGET).then(done, function(){ window.prompt('Zkopíruj odkaz:', TARGET); });
    else window.prompt('Zkopíruj odkaz:', TARGET);
  }
  var c1 = document.getElementById('copy'); if (c1) c1.addEventListener('click', copy);
  var c2 = document.getElementById('copy2'); if (c2) c2.addEventListener('click', copy);
})();
</script>
</body>
</html>
